[project]
name = "friday-backend"
version = "0.1.0"
description = "Production-grade API for the FRIDAY analytics assistant"
authors = [{name = "Friday"}]
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "google-cloud-bigquery>=3.18.0",
    "google-auth>=2.28.0",
    "chromadb>=0.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "google-cloud-aiplatform>=1.56.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "httpx[http2]", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
